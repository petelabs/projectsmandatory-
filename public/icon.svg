<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Subtle circular groove -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Stylized Geometric "M" & Download Arrow Symbol -->
  <!-- Blue Left Wing -->
  <path d="M120 370 L120 170 L200 270 L200 370 Z" fill="url(#primaryGrad)" />
  <!-- Red Right Wing -->
  <path d="M392 370 L392 170 L312 270 L312 370 Z" fill="url(#accentGrad)" />
  <!-- Center Vertex & Downward Download Arrow Head (Orange Highlight) -->
  <path d="M200 170 L256 240 L312 170 L256 230 Z" fill="url(#orangeGrad)" opacity="0.95" />
  
  <!-- Center Download Arrow Stem & Head -->
  <rect x="244" y="240" width="24" height="90" rx="12" fill="#ffffff" />
  <polygon points="214,310 256,365 298,310" fill="#ffffff" />
  
  <!-- Tiny Accent Dot (Green Success/Verified indicator) -->
  <circle cx="392" cy="140" r="18" fill="#10b981" stroke="#0f172a" stroke-width="4" />
</svg>
